version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/infrastructure/database/queries/"
    schema: "internal/infrastructure/database/migrations"
    gen:
      go:
        package: "database"
        out: "internal/infrastructure/database"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
